name: Backend lockfile refresh

on:
  push:
    branches:
      - 'fix/backend-dependency-security-*'
    paths:
      - 'backend/package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-and-verify:
    if: startsWith(github.ref_name, 'fix/backend-dependency-security-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dependency-fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Regenerate backend lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        working-directory: backend

      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
          else
            git commit -m "chore(deps): regenerate backend lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Install exact locked dependencies
        run: npm ci
        working-directory: backend

      - name: Audit backend dependencies
        run: npm audit --audit-level=high
        working-directory: backend

      - name: Backend typecheck
        run: npm run typecheck
        working-directory: backend

      - name: Backend tests
        run: npm test
        working-directory: backend

      - name: Backend production build
        run: npm run build
        working-directory: backend
