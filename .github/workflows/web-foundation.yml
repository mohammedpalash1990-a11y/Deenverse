name: Web foundation checks

on:
  workflow_dispatch:
  push:
    branches:
      - assistant/phase1-web-foundation
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - integration/platform-foundation

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # npm ci is intentionally blocked until a reviewed package-lock.json is committed.
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
