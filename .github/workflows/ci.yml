name: DEENVERSE CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "backend/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.*"
      - "vitest.config.*"
  push:
    branches: [main, integration/platform-foundation]
    paths:
      - ".github/workflows/ci.yml"
      - "backend/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.*"
      - "vitest.config.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deenverse-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-web-lock:
    name: Regenerate web npm lockfile (temporary)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile to this PR branch
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: synchronize web npm lockfile"
            git push origin "HEAD:${BRANCH}"
          fi

  backend:
    name: Backend typecheck, tests and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deenverse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deenverse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/deenverse_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect backend project
        id: backend
        run: |
          if [ -f backend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js
        if: steps.backend.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        if: steps.backend.outputs.present == 'true'
        run: npm ci --no-audit --no-fund
        working-directory: backend
      - name: Typecheck backend
        if: steps.backend.outputs.present == 'true'
        run: npm run typecheck
        working-directory: backend
      - name: Run backend tests
        if: steps.backend.outputs.present == 'true'
        run: npm test
        working-directory: backend
      - name: Build backend
        if: steps.backend.outputs.present == 'true'
        run: npm run build
        working-directory: backend
      - name: Audit backend dependencies
        if: steps.backend.outputs.present == 'true'
        run: npm audit --audit-level=high
        working-directory: backend

  web:
    name: Web typecheck, tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect web project
        id: web
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js
        if: steps.web.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        if: steps.web.outputs.present == 'true'
        run: npm ci --no-audit --no-fund
      - name: Typecheck web
        if: steps.web.outputs.present == 'true'
        run: npm run typecheck
      - name: Run web tests
        if: steps.web.outputs.present == 'true'
        run: npm test
      - name: Build web application
        if: steps.web.outputs.present == 'true'
        run: npm run build
      - name: Audit web dependencies
        if: steps.web.outputs.present == 'true'
        run: npm audit --audit-level=high
