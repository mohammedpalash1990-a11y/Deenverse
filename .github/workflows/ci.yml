name: DEENVERSE CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "backend/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.*"
      - "vitest.config.*"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "backend/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.*"
      - "vitest.config.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deenverse-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend typecheck, tests and build
    runs-on: ubuntu-latest
    if: ${{ hashFiles('backend/package.json') != '' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run backend tests
        run: npm test
      - name: Compile backend
        run: npm run build

  web:
    name: Web typecheck, tests and production build
    runs-on: ubuntu-latest
    if: ${{ hashFiles('package.json') != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck web
        run: npm run typecheck
      - name: Run web tests
        run: npm test
      - name: Build web application
        run: npm run build
