openapi: 3.1.0
info:
  title: DEENVERSE Implemented API
  version: 1.0.0-implementation-snapshot
  description: >
    Implementation-aligned snapshot derived from main commit
    6a1beb1c90aa7d195e8081ca1157649fae4dd305 on 2026-11-03.
    This specification includes only routes registered in the current
    backend source. It does not claim that Quran content is available
    and does not define future editions, Ayah, reciter, audio, auth,
    or user-library routes.
servers:
  - url: http://localhost:4000
    description: Local backend development
tags:
  - name: System
  - name: Quran catalogue metadata
paths:
  /api/v1/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness probe
      responses:
        '200':
          description: Backend process is responding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/ready:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Database and required-schema readiness probe
      responses:
        '200':
          description: Database is connected and required migrations are applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          description: Database connection or required schema is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/quran/surahs:
    get:
      tags: [Quran catalogue metadata]
      operationId: listSurahMetadata
      summary: List approved-source-gated Surah metadata
      description: >
        Returns catalogue metadata only. It does not return Ayah text.
        If no qualifying approved and distributable source is available,
        the endpoint fails closed with CONTENT_UNAVAILABLE.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of Surah metadata. An empty data array is possible when a qualifying source has no rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurahListResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          description: No active approved distributable Quran metadata source passed the current database checks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/quran/surahs/{surahNumber}:
    get:
      tags: [Quran catalogue metadata]
      operationId: getSurahMetadata
      summary: Get one Surah metadata record
      description: Returns one metadata record, not Ayah text and not a one-element array.
      parameters:
        - name: surahNumber
          in: path
          required: true
          description: Decimal Surah number from 1 through 114.
          schema:
            type: string
            pattern: '^(?:[1-9]|[1-9][0-9]|1[01][0-9]|114)$'
      responses:
        '200':
          description: One Surah metadata record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurahDetailResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          description: No active approved distributable Quran metadata source passed the current database checks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Backend page size. Defaults to 20; maximum is 50.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: >
        Server-issued cursor. The current backend encodes a non-negative
        numeric offset as canonical base64. Clients must treat it as opaque
        and return it unchanged; it is not bound to a query or edition.
      schema:
        type: string
        minLength: 1
  schemas:
    HealthResponse:
      type: object
      required: [status, probe, timestamp, requestId]
      properties:
        status:
          const: healthy
        probe:
          const: liveness
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          minLength: 1
    ReadinessResponse:
      type: object
      required: [status, probe, database, migrations, timestamp, requestId]
      properties:
        status:
          const: ready
        probe:
          const: readiness
        database:
          const: connected
        migrations:
          const: applied
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          minLength: 1
    ApiMeta:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
          minLength: 1
        nextCursor:
          type: [string, 'null']
    SurahListResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          type: object
          required: [requestId, nextCursor]
          properties:
            requestId:
              type: string
              minLength: 1
            nextCursor:
              type: [string, 'null']
        data:
          type: array
          items:
            $ref: '#/components/schemas/SurahRecord'
    SurahDetailResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: '#/components/schemas/ApiMeta'
        data:
          $ref: '#/components/schemas/SurahRecord'
    SurahRecord:
      type: object
      required: [id, type, title, locale, provenance, payload]
      properties:
        id:
          type: string
          pattern: '^quran:surah:(?:[1-9]|[1-9][0-9]|1[01][0-9]|114)$'
        type:
          const: quran
        title:
          type: string
          minLength: 1
        locale:
          const: ar
        provenance:
          $ref: '#/components/schemas/ContentProvenance'
        payload:
          $ref: '#/components/schemas/SurahPayload'
    SurahPayload:
      type: object
      required:
        - surahNumber
        - nameArabic
        - nameSimple
        - nameEnglish
        - revelationPlace
        - revelationOrder
        - versesCount
      properties:
        surahNumber:
          type: integer
          minimum: 1
          maximum: 114
        nameArabic:
          type: string
        nameSimple:
          type: string
        nameEnglish:
          type: string
        revelationPlace:
          type: string
          enum: [makkah, madinah]
        revelationOrder:
          type: integer
        versesCount:
          type: integer
          minimum: 1
    ContentProvenance:
      type: object
      required:
        - contentType
        - sourceId
        - edition
        - sourceUrl
        - attribution
        - licenseId
        - redistributionAllowed
        - reviewer
        - reviewedAt
        - approvalStatus
        - reviewDecisionId
        - approvedByAuthority
        - approvedAt
        - checksum
      properties:
        contentType:
          const: quran
        sourceId:
          type: string
          minLength: 1
        edition:
          type: string
          minLength: 1
        sourceUrl:
          type: string
          format: uri
          pattern: '^https://'
        attribution:
          type: string
          minLength: 1
        licenseId:
          type: string
          minLength: 1
        redistributionAllowed:
          const: true
        reviewer:
          type: string
          minLength: 1
        reviewedAt:
          type: string
          format: date-time
        approvalStatus:
          const: approved
        reviewDecisionId:
          type: string
          minLength: 1
        approvedByAuthority:
          type: string
          minLength: 1
        approvedAt:
          type: string
          format: date-time
        checksum:
          type: string
          pattern: '^[a-f0-9]{64}$'
    Error:
      type: object
      required: [code, message, requestId, details, retryable]
      properties:
        code:
          type: string
          enum:
            - UNAVAILABLE
            - UNAUTHORIZED
            - UNAUTHENTICATED
            - FORBIDDEN
            - INVALID_QUERY
            - VALIDATION_ERROR
            - NOT_FOUND
            - RATE_LIMITED
            - CONTENT_UNAVAILABLE
            - INTEGRITY_REJECTED
            - INTERNAL_ERROR
        message:
          type: string
        requestId:
          type: string
          minLength: 1
        details:
          type: array
          items: {}
        retryable:
          type: boolean
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
  responses:
    ErrorResponse:
      description: Stable error envelope without internal stack or provider diagnostics.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
